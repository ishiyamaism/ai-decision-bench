[project]
name = "ai-decision-bench"
version = "0.2.0"
description = "A small, reproducible benchmark for structured AI decision APIs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yuuki Ishiyama" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/ishiyamaism/ai-decision-bench"
Issues = "https://github.com/ishiyamaism/ai-decision-bench/issues"

[project.scripts]
ai-decision-bench = "ai_decision_bench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
